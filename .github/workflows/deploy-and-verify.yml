name: Tenacity CD

on:
  workflow_run:
    workflows: ["Tenacity CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tenacity-gitops-update
  cancel-in-progress: false

jobs:
  update-image-tag:
    name: Update image tag for Argo CD
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate image tag
        run: '[[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]'

      - name: Update image tags in values.yaml
        run: |
          set -euo pipefail
          yq -i '.api.image.tag = strenv(IMAGE_TAG) | .frontend.image.tag = strenv(IMAGE_TAG)' \
            charts/tenacity/values.yaml
          git diff charts/tenacity/values.yaml

      - name: Validate Helm chart
        run: |
          set -euo pipefail
          helm lint ./charts/tenacity
          helm template tenacity ./charts/tenacity --namespace tenacity > /dev/null

      - name: Commit and push new tag
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Image tag already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/tenacity/values.yaml
          git commit -m "Deploy ${IMAGE_TAG::7} [skip ci]"
          git pull --rebase origin main
          git push origin main

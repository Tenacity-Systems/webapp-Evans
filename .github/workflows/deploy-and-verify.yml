name: Tenacity CD

on:
  workflow_run:
    workflows: ["Tenacity CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tenacity-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout the successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Copy deployment file to EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            'mkdir -p ~/tenacity'

          scp -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            docker-compose.ec2.yml \
            "$EC2_USER@$EC2_HOST:tenacity/docker-compose.ec2.yml"

      - name: Deploy and verify on EC2
        run: |
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9_-]+$ ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$DOCKERHUB_USERNAME' '$IMAGE_TAG'" <<'REMOTE'
          set -euo pipefail

          export DOCKERHUB_USERNAME="$1"
          export IMAGE_TAG="$2"
          cd ~/tenacity

          docker --version
          docker compose version

          trap 'docker compose -f docker-compose.ec2.yml logs --tail=50' ERR

          docker compose -f docker-compose.ec2.yml pull
          docker compose -f docker-compose.ec2.yml up \
            -d --no-build --wait --wait-timeout 180

          docker compose -f docker-compose.ec2.yml ps
          curl --fail --retry 5 --retry-connrefused \
            --retry-delay 3 http://localhost:80/
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key

      







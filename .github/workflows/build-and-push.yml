name: Tenacity CI

on:
  push:
    branches:
      - main
      - break-fix

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest

      - name: Run API tests
        run: pytest api/test_app.py -v

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test-api

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/break-fix')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build \
            -t "${{ vars.DOCKERHUB_USERNAME }}/tenacity-api:${{ github.sha }}" \
            -t "${{ vars.DOCKERHUB_USERNAME }}/tenacity-api:latest" \
            /app

      - name: Build frontend image
        run: |
          docker build \
            -t "${{ vars.DOCKERHUB_USERNAME }}/tenacity-frontend:${{ github.sha }}" \
            -t "${{ vars.DOCKERHUB_USERNAME }}/tenacity-frontend:latest" \
            ./frontend

      - name: Push API images
        run: |
          docker push "${{ vars.DOCKERHUB_USERNAME }}/tenacity-api:${{ github.sha }}"
          docker push "${{ vars.DOCKERHUB_USERNAME }}/tenacity-api:latest"

      - name: Push frontend images
        run: |
          docker push "${{ vars.DOCKERHUB_USERNAME }}/tenacity-frontend:${{ github.sha }}"
          docker push "${{ vars.DOCKERHUB_USERNAME }}/tenacity-frontend:latest"

name: Build and Push image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:
  test-api:
    name: Testing Api
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependecy-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest

      - name: Run API pytest
        working-directory: api
        run: pytest -v  

   build-and-push:
     name: Build and push images
     runs-on: ubuntu-latest
     needs: test-api

     if: github.event_name == 'push' && github.ref == 'refs/heads/main'

     steps:
       - name: checkout code
         uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-actions@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API  image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/tenacity-api:${{ github.sha }}
            -t ${{ vars.DOCKERHUB_USERNAME }}/tenacity-api:latest \
            ./frontend

      - name: Push API image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/tenacity-api:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/tenacity-api:latest

      - name: Push frontend images
        run:
          docker push ${{ vars.DOCKERHUB_USERNAME }}/tenacity-frontend:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/tenacity-frontend:latest

      - name: List Directories
        run: |
          pwd
          ls -la

      - name: List docker images
        run: docker images
   


    
